<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teeru — Home</title>

  <style>
    :root{
      --purple:#4b00b5;
      --purple-100:#f5f0ff;
      --muted:#6b6b7a;
      --card:#fafafa;
      --radius:12px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Segoe UI", Roboto, Arial, sans-serif;
      background:#fff;
      color:#222;
      -webkit-font-smoothing:antialiased;
    }

    /* Header */
    .header{
      background:var(--purple);
      color:#fff;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;letter-spacing:0.3px}
    .logo img{width:44px;height:44px;border-radius:10px;border:2px solid rgba(255,255,255,0.85);object-fit:cover}

    /* Right controls */
    .controls{display:flex;align-items:center;gap:12px}
    .notification{
      position:relative;
      width:44px;height:44px;
      display:inline-flex;align-items:center;justify-content:center;
      border-radius:10px;background:rgba(255,255,255,0.08);
      cursor:pointer;transition:transform .12s ease;border:none;outline:none;
    }
    .notification:hover{transform:translateY(-2px)}
    .notification .badge{
      position:absolute;top:-6px;right:-6px;background:#ff3b30;color:#fff;
      font-size:11px;padding:3px 6px;border-radius:999px;border:2px solid var(--purple);
      font-weight:700;line-height:1;
    }
    .avatar{width:36px;height:36px;border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,0.15)}
    .avatar img{width:100%;height:100%;object-fit:cover}

    /* Main menu */
    .main{padding:20px;max-width:760px;margin:18px auto}
    .welcome{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .welcome h1{margin:0;font-size:20px;letter-spacing:0.2px}
    .balance{text-align:right;color:var(--muted);font-size:14px}
    .menu{display:flex;flex-direction:column;gap:12px}

    .menu-item{
      display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--radius);
      background:var(--card);border:1px solid #eee;text-decoration:none;color:inherit;
      transition:box-shadow .14s ease, transform .12s ease, border-color .12s ease;
    }
    .menu-item:hover{box-shadow:0 6px 20px rgba(75,0,181,0.08);transform:translateY(-4px);border-color:var(--purple)}

    .item-icon{width:52px;height:52px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--purple-100);color:var(--purple);font-size:20px;flex-shrink:0}
    .item-icon svg{width:24px;height:24px;display:block}
    .item-content{flex:1;display:flex;flex-direction:column}
    .item-title{font-size:16px;font-weight:600}
    .item-sub{font-size:13px;color:var(--muted);margin-top:4px}
    .chev{color:#bdbdd3;font-size:14px;margin-left:8px;display:flex;align-items:center}
    .chev svg{width:14px;height:14px}

    .ads{position:fixed;left:0;right:0;bottom:0;background:var(--purple);color:#fff;padding:12px 16px;text-align:center;font-weight:700;font-size:15px;border-top-left-radius:10px;border-top-right-radius:10px}

    @media (max-width:520px){
      .main{padding:14px;margin:12px}
      .item-icon{width:46px;height:46px;font-size:16px}
    }
  </style>
</head>
<body>
  <header class="header" role="banner">
    <div class="logo" aria-hidden="false">
      <!-- replace logo.png with your logo file -->
      <img src="images/logo.png" alt="Teeru logo">
      <span>Teeru</span>
    </div>

    <div class="controls" aria-hidden="false">
      <!-- Notification (inline SVG bell) -->
      <a href="notification.html" title="Notifications" aria-label="Notifications">
  <button class="notification">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L3 17h5"></path>
      <path d="M13.7 20a2.5 2.5 0 01-3.4 0"></path>
    </svg>
    <span class="badge" aria-hidden="true">3</span>
  </button>
</a>

  </header>

  <main class="main" role="main">
    <div class="welcome">
      <h1>Hello, Kinzang 👋</h1>
      <div class="balance">Wallet: <strong>Nu. 4,350</strong></div>
    </div>

    <nav class="menu" aria-label="Primary navigation">
      <a class="menu-item" href="add-expense.html">
        <div class="item-icon" aria-hidden="true">
          <!-- plus -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </div>
        <div class="item-content">
          <div class="item-title">Add Expense</div>
          <div class="item-sub">Quickly record a new expense</div>
        </div>
        <div class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"></path>
          </svg>
        </div>
      </a>

      <a class="menu-item" href="expenses.html">
        <div class="item-icon" aria-hidden="true">
          <!-- receipt/document -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 2h6l3 3v15a1 1 0 01-1 1H5a1 1 0 01-1-1V3a1 1 0 011-1h4z"></path>
            <path d="M9 7h6M9 12h6M9 17h3"></path>
          </svg>
        </div>
        <div class="item-content">
          <div class="item-title">Expenses</div>
          <div class="item-sub">View and edit past transactions</div>
        </div>
        <div class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"></path>
          </svg>
        </div>
      </a>

      <a class="menu-item" href="reports.html">
        <div class="item-icon" aria-hidden="true">
          <!-- pie chart -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12A9 9 0 1112 3v9z"></path>
            <path d="M12 12V3"></path>
          </svg>
        </div>
        <div class="item-content">
          <div class="item-title">Reports</div>
          <div class="item-sub">Pie & bar charts of your spending</div>
        </div>
        <div class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"></path>
          </svg>
        </div>
      </a>

      <a class="menu-item" href="settings.html">
        <div class="item-icon" aria-hidden="true">
          <!-- gear -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.9v-1.8l-2-.4a8.1 8.1 0 00-.8-2l1-1.6-1.4-1.4-1.6 1a8.1 8.1 0 00-2-.8l-.4-2h-1.8l-.4 2a8.1 8.1 0 00-2 .8l-1.6-1-1.4 1.4 1 1.6a8.1 8.1 0 00-.8 2l-2 .4v1.8l2 .4c.1.7.3 1.4.8 2l-1 1.6 1.4 1.4 1.6-1c.6.4 1.3.6 2 .8l.4 2h1.8l.4-2c.7-.1 1.4-.3 2-.8l1.6 1 1.4-1.4-1-1.6c.5-.6.7-1.3.8-2l2-.4z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </div>
        <div class="item-content">
          <div class="item-title">Settings</div>
          <div class="item-sub">Preferences, profile and app options</div>
        </div>
        <div class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"></path>
          </svg>
        </div>
      </a>
    </nav>
  </main>

  <div class="ads" role="contentinfo">Advertisement</div>
</body>
</html>
