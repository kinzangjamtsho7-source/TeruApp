<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teeru — Advertisements</title>
  <style>
    :root{ --purple:#4b00b5; --radius:12px; }
    *{ box-sizing:border-box }
    body{ margin:0; font-family:"Segoe UI", Roboto, Arial, sans-serif; background:#fff; color:#222 }
    .header{ background:var(--purple); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px }
    .logo{ display:flex; align-items:center; gap:12px; font-weight:700; font-size:20px }
    .logo img{ width:40px; height:40px; border-radius:10px; border:2px solid rgba(255,255,255,0.85); object-fit:cover }
    .controls{ display:flex; align-items:center; gap:12px }
    .logout{ background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.25); padding:8px 12px; border-radius:8px; text-decoration:none }
    .logout:hover{ background:rgba(255,255,255,0.18) }
    main{ padding:20px; max-width:820px; margin:18px auto }
    .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px }
    .card{ border:1px solid #eee; border-radius:var(--radius); overflow:hidden; background:#fafafa }
    .card img{ width:100%; height:180px; object-fit:cover; display:block }
  </style>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img src="/images/logo.png" alt="Teeru logo">
        <span>Teeru</span>
      </div>
      <div class="controls">
        <a class="logout" href="/logout">Logout</a>
      </div>
    </header>
    <main>
      <h1>Advertisements</h1>
      <div class="grid">
        <div class="card"><img src="/images/Advertisement.jpg" alt="Advertisement"></div>
      </div>
    </main>
  </body>
  </html>
