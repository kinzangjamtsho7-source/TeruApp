<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Teeru — Expenses</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    :root{
      --purple:#4b00b5;
      --muted:#6b6b7a;
      --radius:12px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Segoe UI",Roboto,Arial,sans-serif;
      background:#fff;
      color:#222;
    }

    /* Header */
    .header{
      background:var(--purple);
      color:#fff;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:700;
      font-size:20px;
    }
    .logo img{
      width:40px;height:40px;
      border-radius:10px;
      border:2px solid rgba(255,255,255,0.85);
    }
    .controls{display:flex;align-items:center;gap:12px;}
    .notification{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,0.1);cursor:pointer;}
    .notification .badge{position:absolute;top:-5px;right:-5px;background:#ff3b30;color:#fff;font-size:11px;padding:2px 6px;border-radius:999px;border:2px solid var(--purple);font-weight:700;}
    .avatar{width:34px;height:34px;border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,0.2);}
    .avatar img{width:100%;height:100%;object-fit:cover;}

    /* Main Content */
    .main{
      padding:22px;
      margin-bottom:90px;
      max-width:700px;
      margin-left:auto;
      margin-right:auto;
    }
    h1{
      font-size:22px;
      margin-bottom:16px;
      text-align:center;
    }

    /* Expense List */
    .expense-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .expense-card{
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#f9f9f9;
      padding:14px 16px;
      border-radius:var(--radius);
      border:1px solid #eee;
      transition:0.2s;
    }
    .expense-card:hover{
      background:#f1f1ff;
    }
    .expense-info{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .expense-icon{
      width:42px;height:42px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      color:#fff;
    }
    .food{background:#ff6b6b;}
    .transport{background:#4dabf7;}
    .shopping{background:#ffa94d;}
    .entertainment{background:#845ef7;}
    .other{background:#868e96;}

    .expense-text h3{
      margin:0;font-size:16px;
    }
    .expense-text p{
      margin:2px 0 0;
      font-size:13px;
      color:var(--muted);
    }
    .expense-amount{
      font-weight:700;
      font-size:16px;
    }

    /* Bottom Nav */
    .bottom-nav{
      position:fixed;
      bottom:0;left:0;right:0;
      background:var(--purple);
      display:flex;
      justify-content:space-around;
      padding:10px 0;
      color:#fff;
    }
    .bottom-nav a{
      text-align:center;
      font-size:13px;
      text-decoration:none;
      color:inherit;
      flex:1;
      padding:6px 0;
    }
    .bottom-nav i{
      font-size:18px;
      display:block;
      margin-bottom:3px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <img src="images/logo.png" alt="Teeru logo">
      <span>Teeru</span>
    </div>
    <div class="controls">
      <!-- Notification (inline SVG bell) -->
      <a href="notification.html" title="Notifications" aria-label="Notifications">
  <button class="notification">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L3 17h5"></path>
      <path d="M13.7 20a2.5 2.5 0 01-3.4 0"></path>
    </svg>
    <span class="badge" aria-hidden="true">3</span>
  </button>
  </header>

  <!-- Main -->
  <main class="main">
    <h1><i class="fa-solid fa-receipt"></i> Expenses</h1>

    <div class="expense-list">

      <div class="expense-card">
        <div class="expense-info">
          <div class="expense-icon food"><i class="fa-solid fa-utensils"></i></div>
          <div class="expense-text">
            <h3>Lunch</h3>
            <p>01 Oct 2025</p>
          </div>
        </div>
        <div class="expense-amount">Nu. 250</div>
      </div>

      <div class="expense-card">
        <div class="expense-info">
          <div class="expense-icon transport"><i class="fa-solid fa-bus"></i></div>
          <div class="expense-text">
            <h3>Taxi</h3>
            <p>30 Sep 2025</p>
          </div>
        </div>
        <div class="expense-amount">Nu. 120</div>
      </div>

      <div class="expense-card">
        <div class="expense-info">
          <div class="expense-icon shopping"><i class="fa-solid fa-bag-shopping"></i></div>
          <div class="expense-text">
            <h3>Groceries</h3>
            <p>29 Sep 2025</p>
          </div>
        </div>
        <div class="expense-amount">Nu. 800</div>
      </div>

      <div class="expense-card">
        <div class="expense-info">
          <div class="expense-icon entertainment"><i class="fa-solid fa-film"></i></div>
          <div class="expense-text">
            <h3>Movie</h3>
            <p>28 Sep 2025</p>
          </div>
        </div>
        <div class="expense-amount">Nu. 300</div>
      </div>

    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html"><i class="fa-solid fa-house"></i>Home</a>
    <a href="add-expense.html"><i class="fa-solid fa-plus-square"></i>Add</a>
    <a href="Reports.html"><i class="fa-solid fa-chart-pie"></i>Reports</a>
    <a href="Expenses.html"><i class="fa-solid fa-receipt"></i>Expenses</a>
    <a href="settings.html"><i class="fa-solid fa-gear"></i>Settings</a>
  </nav>

</body>
</html>
